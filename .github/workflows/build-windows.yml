name: Build Windows executables

# PyInstaller cannot cross-compile, so the executables have to be produced on
# Windows. This does that, proves the frozen build works by running its own
# self-test on the runner, and publishes the result as a downloadable zip.

on:
  push:
    branches: ["main", "claude/**"]
    paths-ignore: ["**.md", "START HERE.txt"]
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  VERSION: "1.2.0"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Show versions
        run: |
          python -c "import sys, pymupdf, PIL; print('python ', sys.version)"
          python -c "import pymupdf, PIL; print('pymupdf', pymupdf.__version__); print('pillow ', PIL.__version__)"
          python -m PyInstaller --version

      - name: Engine tests
        run: python tests/test_affstamp.py

      - name: GUI tests
        run: python tests/test_gui.py

      - name: Build both executables
        run: python -m PyInstaller --noconfirm --clean AffStamp.spec

      - name: Drop the unused pymupdf C++ headers
        run: |
          $devel = "dist\AffStamp\_internal\pymupdf\mupdf-devel"
          if (Test-Path $devel) { Remove-Item -Recurse -Force $devel }

      - name: Stage the documentation beside the executables
        run: |
          Copy-Item RUNBOOK.md dist\AffStamp\
          Copy-Item "START HERE.txt" dist\AffStamp\

      - name: Verify the frozen build
        # This is the same check START HERE.txt tells the operator to run on
        # the Acrobat machine. If it fails, the exe does not ship.
        run: |
          dist\AffStamp\AffStamp-cli.exe --version
          dist\AffStamp\AffStamp-cli.exe selftest

      - name: Confirm the windowed executable launches
        run: |
          $exe = "dist\AffStamp\AffStamp.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Write-Error "AffStamp.exe exited on its own (code $($p.ExitCode))"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "AffStamp.exe stayed running - the window opened."

      - name: Hash every shipped file
        run: |
          Push-Location dist\AffStamp
          Get-ChildItem -Recurse -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            ForEach-Object {
              $rel = (Resolve-Path -Relative $_.FullName) -replace '^\.\\', '' -replace '\\', '/'
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $rel"
            } | Sort-Object | Set-Content -Encoding utf8 SHA256SUMS.txt
          Pop-Location

      - name: Package
        run: |
          Compress-Archive -Path dist\AffStamp -DestinationPath "AffStamp-$env:VERSION-win64.zip" -CompressionLevel Optimal
          $zip = "AffStamp-$env:VERSION-win64.zip"
          $mb  = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "$zip  $mb MB"
          Write-Host "SHA-256: $sha"
          "ZIP_SHA=$sha"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_SIZE=$mb"  | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: AffStamp-${{ env.VERSION }}-win64
          path: AffStamp-${{ env.VERSION }}-win64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish a release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION-build$env:GITHUB_RUN_NUMBER"
          $notes = @"
          AffStamp $env:VERSION - Windows 64-bit.

          Download ``AffStamp-$env:VERSION-win64.zip``, unzip it anywhere on the
          machine with Acrobat, and double-click ``AffStamp.exe``. Nothing is
          installed and no admin rights are needed. Read ``START HERE.txt`` first.

          Built and verified on this runner: the engine and GUI test suites pass,
          ``AffStamp-cli.exe selftest`` passes from the frozen build, and
          ``AffStamp.exe`` opens its window.

          Requires 64-bit Windows 10 1607 or later.

          Zip SHA-256: ``$env:ZIP_SHA``
          "@
          gh release create $tag "AffStamp-$env:VERSION-win64.zip" `
            --title "AffStamp $env:VERSION (build $env:GITHUB_RUN_NUMBER)" `
            --notes $notes
