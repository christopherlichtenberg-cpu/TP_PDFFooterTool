name: Build PDFLinkCheck

# Side release: the standalone hyperlink auditor, packaged for machines with
# no Python. Independent of the AffStamp build.

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "pdflinkcheck.py"
      - "PDFLinkCheck.spec"
      - "pdflinkcheck_version.txt"
      - "pdflinkcheck_readme.txt"
      - "tests/test_pdflinkcheck.py"
      - ".github/workflows/build-pdflinkcheck.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  VERSION: "1.0.0"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Deliberately no Pillow: pdflinkcheck never renders a page, and
        # leaving it out keeps the build small.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pymupdf pyinstaller

      - name: Tests
        run: python tests/test_pdflinkcheck.py

      - name: Build the folder version
        run: python -m PyInstaller --noconfirm --clean PDFLinkCheck.spec

      - name: Build the single-file version
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console `
            --name PDFLinkCheck-single `
            --version-file pdflinkcheck_version.txt `
            --exclude-module PIL --exclude-module tkinter `
            --exclude-module numpy --exclude-module affstamp `
            --exclude-module affstamp_gui `
            pdflinkcheck.py

      - name: Drop the unused pymupdf C++ headers
        run: |
          $devel = "dist\PDFLinkCheck\_internal\pymupdf\mupdf-devel"
          if (Test-Path $devel) { Remove-Item -Recurse -Force $devel }

      - name: Verify the frozen build actually works
        # Build a PDF carrying every link type, then prove the exe fails it,
        # fixes it, and passes the fixed copy. If any of that is wrong,
        # nothing ships.
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); from test_pdflinkcheck import make_bundle; make_bundle('ci_fixture.pdf')"
          $exe = "dist\PDFLinkCheck\PDFLinkCheck.exe"

          & $exe --version
          if ($LASTEXITCODE -ne 0) { Write-Error "--version failed"; exit 1 }

          & $exe ci_fixture.pdf --no-pause
          if ($LASTEXITCODE -ne 1) {
            Write-Error "expected exit 1 on the bad fixture, got $LASTEXITCODE"
            exit 1
          }

          & $exe ci_fixture.pdf --fix --no-pause | Out-Null
          if (-not (Test-Path "ci_fixture_fixed.pdf")) {
            Write-Error "--fix wrote nothing"; exit 1
          }

          & $exe ci_fixture_fixed.pdf --no-pause
          if ($LASTEXITCODE -ne 0) {
            Write-Error "the fixed file should pass, got $LASTEXITCODE"
            exit 1
          }

          # the subfolder must survive the rewrite
          $out = & $exe ci_fixture_fixed.pdf --no-pause -v | Out-String
          if ($out -notmatch "Exhibits/DOC-002\.pdf") {
            Write-Error "--fix flattened a subfolder"; exit 1
          }

          # and the single-file build must behave identically
          & "dist\PDFLinkCheck-single.exe" ci_fixture.pdf --no-pause
          if ($LASTEXITCODE -ne 1) {
            Write-Error "single-file build disagreed, got $LASTEXITCODE"
            exit 1
          }

          Write-Host "frozen build verified: detects, fixes, and passes the fixed copy"
          exit 0

      - name: Stage the package
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse dist\PDFLinkCheck package\PDFLinkCheck
          Copy-Item dist\PDFLinkCheck-single.exe package\
          Copy-Item pdflinkcheck_readme.txt "package\READ ME.txt"
          Push-Location package
          Get-ChildItem -Recurse -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            ForEach-Object {
              $rel = (Resolve-Path -Relative $_.FullName) -replace '^\.\\', '' -replace '\\', '/'
              "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $rel"
            } | Sort-Object | Set-Content -Encoding utf8 SHA256SUMS.txt
          Pop-Location

      - name: Package
        run: |
          $zip = "PDFLinkCheck-$env:VERSION-win64.zip"
          Compress-Archive -Path package\* -DestinationPath $zip -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "$zip  $mb MB"
          Write-Host "SHA-256: $sha"
          "ZIP_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_SIZE=$mb" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: PDFLinkCheck-${{ env.VERSION }}-win64
          path: PDFLinkCheck-${{ env.VERSION }}-win64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish a release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "pdflinkcheck-v$env:VERSION-build$env:GITHUB_RUN_NUMBER"
          $notes = @"
          PDFLinkCheck $env:VERSION - Windows 64-bit. Side release, separate from AffStamp.

          Checks that a PDF's hyperlinks are **relative** and carry a **``/GoToR``**
          action, so exhibits open in the PDF viewer rather than a browser - and
          rewrites the ones that do not.

          Unzip anywhere. Drag a PDF onto ``PDFLinkCheck\PDFLinkCheck.exe``, or
          double-click it and paste a path. ``PDFLinkCheck-single.exe`` is the same
          tool as one self-contained file. Read ``READ ME.txt`` first.

          No Python, no installer, no admin rights. 64-bit Windows 10 1607 or later.

          Verified on the runner: the test suite passes, and the frozen exe is run
          against a PDF carrying every link type - it must fail it, fix it, pass the
          fixed copy, and preserve subfolder paths, or the build does not ship.

          Built from commit ``$env:GITHUB_SHA`` on ``$env:GITHUB_REF_NAME``.
          Zip SHA-256: ``$env:ZIP_SHA``
          "@
          gh release create $tag "PDFLinkCheck-$env:VERSION-win64.zip" `
            --target $env:GITHUB_SHA `
            --title "PDFLinkCheck $env:VERSION (build $env:GITHUB_RUN_NUMBER)" `
            --notes $notes
